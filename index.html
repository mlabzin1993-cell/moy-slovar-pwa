<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142b49">
<meta name="description" content="Личный словарь на русском, чешском, сербском и немецком языках.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мой словарь">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Мой словарь — версия 0.4</title>
<style>
:root{
 --navy:#142b49;--navy2:#203e61;--gold:#c6a45b;--gold-soft:#f5eedf;
 --paper:#f4f6f8;--card:#fff;--ink:#17283b;--muted:#718096;--line:#e3e8ee;
 --blue-soft:#edf2f7;--red:#a34747;--red-soft:#faeeee;
 --shadow:0 8px 26px rgba(20,43,73,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.topbar{background:linear-gradient(125deg,var(--navy),#1c3b60);color:#fff;padding:19px 17px 21px;box-shadow:0 4px 18px #142b4924}
.topinner{max-width:820px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:66px;height:66px;object-fit:cover;border-radius:16px;border:1px solid #d0b36e;box-shadow:0 3px 14px #07172b66;flex:none}
.brand h1{font-size:21px;line-height:1.2;margin:0 0 5px;font-weight:750;letter-spacing:.1px}
.brand p{margin:0;color:#d9e2ed;font-size:12px;letter-spacing:.2px}
main{max-width:820px;margin:0 auto;padding:17px 14px 38px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.toolbarhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sectiontitle{font-size:17px;font-weight:750;margin:0}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.searchrow{display:flex;gap:8px}
input,textarea{width:100%;min-width:0;border:1px solid #d6dee7;border-radius:11px;padding:12px 13px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:#8aa3bc;box-shadow:0 0 0 3px #dce7f1}
.searchrow input{flex:1}
button{border:0;border-radius:11px;padding:10px 14px;font-weight:650;font-size:13px;transition:filter .15s,transform .15s}
button:active{transform:translateY(1px)}
button:hover{filter:brightness(.97)}
.primary{background:var(--navy);color:white}
.addbtn{background:var(--gold);color:#17283b;white-space:nowrap}
.secondary{background:var(--blue-soft);color:var(--navy2)}
.danger{background:var(--red-soft);color:var(--red)}
.toolbaractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.toolbaractions button{font-size:12px;padding:8px 11px}
.listpanel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:4px 15px;box-shadow:var(--shadow)}
.entry{border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entrytop{display:flex;align-items:center;gap:9px;padding:9px 0}
.word-toggle{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;background:transparent;color:var(--ink);padding:7px 3px;font-size:15px;font-weight:730}
.chevron{color:var(--gold);font-size:12px;transition:transform .15s;flex:none}
.entry.expanded .chevron{transform:rotate(90deg)}
.word-label{min-width:0;overflow-wrap:anywhere}
.meaning{font-size:12px;color:var(--muted);font-weight:450;margin-top:1px}
.entrybuttons{display:flex;gap:5px;flex:none}
.entrybuttons button{padding:7px 9px;font-size:11px;font-weight:600}
.translations{display:none;padding:1px 5px 14px 25px;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.entry.expanded .translations{display:grid}
.translationbox{background:#f7f9fb;border:1px solid #edf0f4;border-radius:10px;padding:9px 10px;min-width:0}
.lang{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.translation{font-size:14px;font-weight:570;overflow-wrap:anywhere}
.note{grid-column:1/-1;color:var(--muted);font-size:12px;padding:1px 2px}
.empty{text-align:center;color:var(--muted);padding:27px 8px;font-size:14px}
.footer-note{text-align:center;color:#8793a1;font-size:11px;margin:14px 4px 0}
dialog{border:0;padding:0;border-radius:18px;width:min(560px,calc(100% - 24px));max-height:calc(100% - 28px);box-shadow:0 22px 70px #0b1d3370;color:var(--ink)}
dialog::backdrop{background:#0b1d3377;backdrop-filter:blur(3px)}
.dialoghead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px 12px;border-bottom:1px solid var(--line)}
.dialoghead h2{font-size:17px;margin:0}
.closebtn{background:var(--blue-soft);color:var(--navy);font-size:18px;padding:4px 10px}
.formbody{padding:15px 18px 18px;overflow:auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{min-width:0}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:0 0 5px}
.field input{padding:10px 11px}
.full{grid-column:1/-1}
.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.formhint{font-size:11px;color:var(--muted);margin:12px 0 0}
.hidden{display:none!important}
@media(max-width:520px){
 .topbar{padding:15px 14px 17px}.logo{width:58px;height:58px;border-radius:14px}
 .brand h1{font-size:18px}.brand p{font-size:11px}
 main{padding:12px 10px 28px}
 .toolbar{padding:12px;border-radius:15px}
 .toolbarhead{align-items:flex-start;flex-direction:column;gap:2px}
 .searchrow{flex-wrap:wrap}.searchrow input{flex-basis:100%}.searchrow .addbtn{flex:1}
 .listpanel{padding:3px 11px;border-radius:15px}
 .entrybuttons button{padding:7px 8px;font-size:10px}
 .word-toggle{font-size:14px;gap:8px}
 .translations{padding-left:19px;gap:7px}
 .translationbox{padding:8px}
 .translation{font-size:13px}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>

let words=[];
const $=id=>document.getElementById(id);
function norm(s){return String(s??'').toLocaleLowerCase('ru').trim()}
function sortWords(){
 words.sort((a,b)=>norm(a.ru).localeCompare(norm(b.ru),'ru',{sensitivity:'base'})||norm(a.meaning).localeCompare(norm(b.meaning),'ru',{sensitivity:'base'}));
}
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  const saved=raw===null?INITIAL_WORDS:JSON.parse(raw);
  words=Array.isArray(saved)?saved:[];
  if(raw===null)localStorage.setItem(KEY,JSON.stringify(words));
 }catch(e){words=INITIAL_WORDS.slice()}
}
function persist(){localStorage.setItem(KEY,JSON.stringify(words))}
function escapeHtml(s){
 return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
 const q=norm($('search').value);
 const filtered=words.filter(w=>[w.ru,w.meaning,w.cs,w.sr,w.de,w.notes].some(v=>norm(v).includes(q)));
 $('count').textContent=`Записей: ${words.length} · Найдено: ${filtered.length}`;
 if(!filtered.length){
  $('list').innerHTML='<div class="empty">'+(words.length?'Ничего не найдено. Попробуй другой запрос.':'Словарь пока пуст. Добавь первое слово.')+'</div>';
  return;
 }
 $('list').innerHTML=filtered.map(w=>{
  const id=escapeHtml(w.id);
  return `<article class="entry" data-entry-id="${id}">
   <div class="entrytop">
    <button type="button" class="word-toggle" data-action="toggle" aria-expanded="false">
     <span class="chevron" aria-hidden="true">▶</span>
     <span class="word-label">${escapeHtml(w.ru)}${w.meaning?`<span class="meaning">${escapeHtml(w.meaning)}</span>`:''}</span>
    </button>
    <div class="entrybuttons">
     <button type="button" class="secondary" data-action="edit">Изменить</button>
     <button type="button" class="danger" data-action="delete">Удалить</button>
    </div>
   </div>
   <div class="translations">
    <div class="translationbox"><div class="lang">Русский</div><div class="translation">${escapeHtml(w.ru)||'—'}</div></div>
    <div class="translationbox"><div class="lang">Чешский</div><div class="translation">${escapeHtml(w.cs)||'—'}</div></div>
    <div class="translationbox"><div class="lang">Сербский</div><div class="translation">${escapeHtml(w.sr)||'—'}</div></div>
    <div class="translationbox"><div class="lang">Немецкий</div><div class="translation">${escapeHtml(w.de)||'—'}</div></div>
    ${w.notes?`<div class="note">Примечание: ${escapeHtml(w.notes)}</div>`:''}
   </div>
  </article>`;
 }).join('');
}
function openEditor(item=null){
 $('wordForm').reset();
 $('editId').value='';
 $('formTitle').textContent=item?'Изменить запись':'Добавить слово';
 $('saveBtn').textContent=item?'Сохранить изменения':'Добавить в словарь';
 $('cancelEdit').classList.toggle('hidden',!item);
 if(item){
  $('editId').value=item.id;
  $('ru').value=item.ru||'';$('meaning').value=item.meaning||'';
  $('cs').value=item.cs||'';$('sr').value=item.sr||'';
  $('de').value=item.de||'';$('notes').value=item.notes||'';
 }
 if(!$('editorDialog').open)$('editorDialog').showModal();
 setTimeout(()=>$('ru').focus(),80);
}
function closeEditor(){$('editorDialog').close()}
function editWord(id){const w=words.find(x=>String(x.id)===String(id));if(w)openEditor(w)}
function deleteWord(id){
 if(confirm('Удалить эту запись?')){
  words=words.filter(w=>String(w.id)!==String(id));persist();render();
 }
}
$('addBtn').onclick=()=>openEditor();
$('closeDialog').onclick=closeEditor;
$('cancelEdit').onclick=closeEditor;
$('editorDialog').addEventListener('click',e=>{if(e.target===$('editorDialog'))closeEditor()});
$('list').addEventListener('click',e=>{
 const button=e.target.closest('button[data-action]');if(!button)return;
 const entry=button.closest('[data-entry-id]');if(!entry)return;
 const id=entry.dataset.entryId;
 if(button.dataset.action==='toggle'){
  const expanded=entry.classList.toggle('expanded');button.setAttribute('aria-expanded',String(expanded));
 }else if(button.dataset.action==='edit')editWord(id);
 else if(button.dataset.action==='delete')deleteWord(id);
});
$('wordForm').addEventListener('submit',e=>{
 e.preventDefault();
 const item={
  id:$('editId').value||String(Date.now())+'_'+Math.random().toString(16).slice(2),
  ru:$('ru').value.trim(),meaning:$('meaning').value.trim(),
  cs:$('cs').value.trim(),sr:$('sr').value.trim(),
  de:$('de').value.trim(),notes:$('notes').value.trim()
 };
 const duplicate=words.find(w=>String(w.id)!==String(item.id)&&norm(w.ru).replace(/ё/g,'е')===norm(item.ru).replace(/ё/g,'е')&&norm(w.meaning)===norm(item.meaning));
 if(duplicate){alert('Похоже, такая запись уже есть (в том числе проверь вариант написания через е/ё). Проверь дубликат перед добавлением.');return}
 const i=words.findIndex(w=>String(w.id)===String(item.id));
 if(i>=0)words[i]=item;else words.push(item);
 sortWords();persist();render();closeEditor();
});
$('search').oninput=render;
$('clearSearch').onclick=()=>{$('search').value='';render();$('search').focus()};
$('exportBtn').onclick=()=>{
 const blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');
 a.href=url;a.download='moy-slovar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('invalid');
  if(confirm('Импорт заменит текущий словарь. Перед этим лучше экспортировать резервную копию. Продолжить?')){
   words=data.filter(x=>x&&x.ru).map(x=>({
    id:String(x.id||Date.now()+'_'+Math.random().toString(16).slice(2)),
    ru:String(x.ru||''),meaning:String(x.meaning||''),cs:String(x.cs||''),
    sr:String(x.sr||''),de:String(x.de||''),notes:String(x.notes||'')
   }));
   sortWords();persist();render();
  }
 }catch(err){alert('Не удалось прочитать файл словаря. Проверь формат JSON.')}
 e.target.value='';
};
load();sortWords();render();
</script>

    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch(error => console.warn('Не удалось зарегистрировать Service Worker:', error));
  });
